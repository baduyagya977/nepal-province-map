<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nepal Province Map • Live Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --surface-2: #243044;
    --border: #2d3a4f;
    --text: #f0f4f8;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.02em;
  }
  .header .subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .total-badge {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.95rem;
    color: var(--text);
  }
  .total-badge strong {
    color: #60a5fa;
    font-weight: 700;
    margin-left: 4px;
  }

  .container {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    padding: 20px;
    max-width: 1600px;
    margin: 0 auto;
    height: calc(100vh - 77px);
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title span.icon { font-size: 1rem; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 10px 8px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 8px;
    border-bottom: 1px solid rgba(45, 58, 79, 0.6);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  .province-name {
    font-weight: 500;
    color: #e2e8f0;
    font-size: 0.92rem;
  }
  input[type="number"] {
    width: 100px;
    padding: 8px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #ffffff;
    font-size: 0.92rem;
    font-weight: 600;
    font-family: inherit;
    text-align: right;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
  }

  .palette-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .palette-btn {
    padding: 12px 10px;
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .palette-btn:hover {
    background: #2a3a52;
    border-color: #3d4f6a;
  }
  .palette-btn.active {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.12);
  }
  .swatch {
    display: flex;
    height: 12px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .swatch span { flex: 1; }
  .palette-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #cbd5e1;
  }
  .palette-btn.active .palette-label { color: #93c5fd; }

  .actions { display: flex; flex-direction: column; gap: 8px; }
  button.action {
    width: 100%;
    padding: 11px 14px;
    border: none;
    border-radius: 9px;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: var(--surface-2);
    color: #e2e8f0;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: #2a3a52;
    border-color: #4a5d78;
  }
  .btn-outline {
    background: transparent;
    color: var(--text-muted);
    border: 1px dashed var(--border);
  }
  .btn-outline:hover {
    color: #e2e8f0;
    border-color: #4a5d78;
  }

  .hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 12px;
    line-height: 1.45;
  }

  #map {
    height: 100%;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    min-height: 420px;
    background: #1a2332;
  }

  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-zoom a:hover {
    background: var(--surface-2) !important;
  }
  .leaflet-control-attribution {
    background: rgba(26, 35, 50, 0.85) !important;
    color: var(--text-muted) !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: #60a5fa !important; }

  .leaflet-tooltip {
    background: #1e293b !important;
    border: 1px solid #334155 !important;
    color: #f1f5f9 !important;
    font-family: Inter, sans-serif !important;
    font-size: 0.85rem !important;
    padding: 8px 12px !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4) !important;
  }
  .leaflet-tooltip-top:before {
    border-top-color: #1e293b !important;
  }

  .legend {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    padding: 12px 14px !important;
    color: #e2e8f0 !important;
    font-family: Inter, sans-serif !important;
    font-size: 0.78rem !important;
    box-shadow: var(--shadow) !important;
    line-height: 1.6 !important;
  }
  .legend strong {
    color: #f8fafc !important;
    font-size: 0.82rem;
    display: block;
    margin-bottom: 6px;
  }
  .legend i {
    width: 16px;
    height: 12px;
    float: left;
    margin-right: 8px;
    margin-top: 3px;
    border-radius: 2px;
    opacity: 0.9;
  }

  @media (max-width: 960px) {
    .container {
      grid-template-columns: 1fr;
      height: auto;
      padding-bottom: 40px;
    }
    #map { height: 480px; }
    .header { flex-direction: column; gap: 12px; text-align: center; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">🇳🇵</div>
      <div>
        <h1>Nepal Province Map</h1>
        <div class="subtitle">Live editable choropleth dashboard</div>
      </div>
    </div>
    <div class="total-badge">
      Total <strong id="totalValue">823.00</strong>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="card">
        <div class="card-title"><span class="icon">📊</span> Province Values</div>
        <table>
          <thead>
            <tr>
              <th>Province</th>
              <th style="text-align:right">Value</th>
            </tr>
          </thead>
          <tbody id="dataTable"></tbody>
        </table>
        <p class="hint">Edit any value — map & legend update instantly.</p>
      </div>

      <div class="card">
        <div class="card-title"><span class="icon">🎨</span> Color Palette</div>
        <div class="palette-grid" id="paletteGrid"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="icon">⚡</span> Actions</div>
        <div class="actions">
          <button class="action btn-primary" onclick="resetData()">↺ Reset to Original</button>
          <button class="action btn-secondary" onclick="randomizeData()">🎲 Randomize Values</button>
          <button class="action btn-outline" onclick="exportCSV()">↓ Export CSV</button>
        </div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

</body>
</html>
